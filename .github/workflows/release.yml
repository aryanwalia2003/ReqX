name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Windows Binary
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o reqx.exe main.go

      - name: Build macOS Binaries
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o reqx-darwin-arm64 main.go
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o reqx-darwin-amd64 main.go
          chmod +x reqx-darwin-arm64 reqx-darwin-amd64

      - name: Package Windows Release
        run: |
          rm -rf dist && mkdir dist
          cp reqx.exe install.ps1 dist/
          cd dist && zip ../reqx-windows.zip ./* && cd ..

      - name: Package macOS Releases
        run: |
          tar -czf reqx-darwin-arm64.tar.gz reqx-darwin-arm64
          tar -czf reqx-darwin-amd64.tar.gz reqx-darwin-amd64

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            reqx-windows.zip
            reqx-darwin-arm64.tar.gz
            reqx-darwin-amd64.tar.gz
          body: |
            ## 🚀 ReqX Release ${{ github.ref_name }}

            Welcome to the latest version of **ReqX**.

            ### Installation (Windows)
            1. Download `reqx-windows.zip`.
            2. Extract and run `install.ps1` in PowerShell as Administrator.
            3. Restart your terminal.

            ### One-Liner Install
            ```powershell
            iwr -useb https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

            ### Installation (macOS)
            1. Download `reqx-darwin-arm64.tar.gz` (Apple Silicon) or `reqx-darwin-amd64.tar.gz` (Intel).
            2. `tar -xzf reqx-darwin-*.tar.gz && sudo mv reqx-darwin-* /usr/local/bin/reqx && chmod +x /usr/local/bin/reqx`
            3. First run: `xattr -d com.apple.quarantine /usr/local/bin/reqx` (unsigned binary — Gatekeeper blocks it otherwise)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
